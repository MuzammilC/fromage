name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages
      - run: pnpm codegen:check
      - run: pnpm lint
      - run: pnpm --filter web typecheck
      - run: pnpm test
      - run: uv run --all-packages pytest
      - run: uv run --all-packages check-items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-check-report
          path: item-check-report.md
          if-no-files-found: ignore

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.72.7
      - run: supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,studio,postgres-meta
      - run: supabase db reset
      - run: supabase test db
      - run: scripts/check-unverified-login.sh
