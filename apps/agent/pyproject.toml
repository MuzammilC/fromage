[project]
name = "fromage-agent"
version = "0.1.0"
description = "Fromage agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "langfuse>=5.2.0",
    "livekit-agents>=1.8.12",
    "python-dotenv>=1.2.4",
    "supabase>=2.34.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
