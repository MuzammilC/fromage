expected_speech_acts:
  - saluer et se présenter poliment
  - demander une réservation (jour, heure, nombre de personnes)
  - répondre aux questions de l'interlocuteur (nom, téléphone)
  - accepter ou refuser poliment un horaire proposé
  - demander une information (menu, prix, plat végétarien ou gâteau)
  - remercier et prendre congé
