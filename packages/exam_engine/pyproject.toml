[project]
name = "fromage-exam-engine"
version = "0.1.0"
description = "The pure Session state machine: Draws, Prep Time, Parts, timers and Turn Modes (ADR-0003)"
requires-python = ">=3.11"
dependencies = ["fromage-exam-definition"]

[tool.uv.sources]
fromage-exam-definition = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_exam_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
