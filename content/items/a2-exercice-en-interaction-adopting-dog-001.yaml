candidate_brief:
  Vous voulez adopter un chien. Vous allez dans un refuge pour animaux et vous parlez à
  une employée. Vous posez des questions sur le chien, sur ce qu'il faut faire et sur le prix, puis vous
  décidez si vous l'adoptez.
examiner_role: Employée d'un refuge pour animaux (Refuge Les Quatre Pattes)
examiner_only_data:
  nom_du_refuge: Refuge Les Quatre Pattes
  chien_presente:
    nom: Noisette
    race: croisé labrador
    sexe: femelle
    age: 3 ans
    taille_poids: grande taille, 22 kg
    caractere: douce, joueuse, aime les enfants et les autres chiens, un peu peureuse pendant les orages
    sante: vaccinée, identifiée par puce électronique, stérilisée
