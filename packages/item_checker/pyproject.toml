[project]
name = "fromage-item-checker"
version = "0.1.0"
description = "check-items: checks Items for schema validity, completeness, level and FEI overlap"
requires-python = ">=3.11"
dependencies = ["fromage-exam-definition", "anthropic>=0.40", "pyyaml>=6", "python-dotenv>=1"]

[project.scripts]
check-items = "fromage_item_checker.cli:main"

[tool.uv.sources]
fromage-exam-definition = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_item_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
