  rendez_vous_possible: le candidat peut revenir chercher le chien le samedi suivant à 14 h
expected_speech_acts:
  - saluer et se présenter poliment
  - exprimer son souhait d'adopter un chien
  - poser des questions sur le chien (âge, caractère, santé)
