[project]
name = "fromage-item-generator"
version = "0.1.0"
description = "gen-items: generates draft Items for an Exam Definition Part with Claude"
requires-python = ">=3.11"
dependencies = ["fromage-exam-definition", "anthropic>=0.40", "langfuse>=3", "pyyaml>=6", "python-dotenv>=1"]

[project.scripts]
gen-items = "fromage_item_generator.cli:main"

[tool.uv.sources]
fromage-exam-definition = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_item_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
