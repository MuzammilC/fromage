candidate_brief:
  Vous parlez de l'ordinateur dans votre vie. Vous expliquez quand et pourquoi vous l'utilisez
  et vous racontez un souvenir avec cet objet.
suggested_angles:
  - Quel ordinateur utilisez-vous (à la maison, au travail, portable) ?
  - Que faites-vous avec votre ordinateur ? (travailler, écrire, regarder des films, parler avec la famille)
