    surface: 45 m²
    etage: 3e étage avec ascenseur
    adresse: 12 rue des Lilas, quartier Saint-Marc
    loyer_mensuel: 620 euros
    charges: 50 euros par mois (eau froide et entretien de l'immeuble)
    chauffage: électrique, non compris dans les charges
