    depot_de_garantie: 620 euros (un mois de loyer)
    animaux: chats acceptés, chiens non acceptés
    transports: arrêt de bus ligne 5 à 2 minutes à pied, tramway à 8 minutes à pied
    commerces: boulangerie, supermarché et pharmacie à moins de 5 minutes à pied
    visite:
