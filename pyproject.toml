[tool.uv.workspace]
members = ["apps/agent", "apps/grader", "packages/exam_definition", "packages/item_generator", "packages/item_checker", "packages/exam_engine"]

[tool.uv]
dev-dependencies = ["pytest>=8", "ruff>=0.8", "datamodel-code-generator>=0.26"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
