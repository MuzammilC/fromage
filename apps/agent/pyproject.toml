[project]
name = "fromage-agent"
version = "0.1.0"
description = "Fromage agent"
requires-python = ">=3.11"
dependencies = ["fromage-exam-definition"]

[tool.uv.sources]
fromage-exam-definition = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
