[project]
name = "fromage-exam-definition"
version = "0.1.0"
description = "Exam Definition models and validation, generated from schema/exam-definition.schema.json"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fromage_exam_definition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
